[project]
name = "money-audit"
version = "0.1.0"
description = "개인 금융 데이터(증권 계좌 + 지출 내역)를 정기적으로 감사하는 에이전트"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    "pyzipper>=0.3.6",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
]

[project.scripts]
money-audit = "money_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/money_audit"]
