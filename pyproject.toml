[project]
name = "k-money"
version = "0.4.0"
description = "돈동생 (⚠️ src/ 의 파이썬 파이프라인은 Apps Script 로 대체됐다. docs/DECISIONS.md 참고)"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    "pyzipper>=0.3.6",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
]

[project.scripts]
k-money = "k_money.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k_money"]
